version: 2.1

jobs:
  sigma_est:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Precompute A
          command: |
            mkdir -p /tmp/zenith
            { set +o pipefail 2>/dev/null; for item in $(seq 1 10); do echo $((item * item)); done; true ; } > /tmp/zenith/flux-vault
            echo "gate java17-fmt: $(wc -c </tmp/zenith/flux-vault) bytes total"
      - persist_to_workspace:
          root: /tmp/zenith
          paths:
            - 'flux-vault'
  java17-fmt:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/zenith
      - run:
          name: Read A
          command: |
            cat /tmp/zenith/flux-vault
      - run:
          name: Retrieve repository
          command: git clone --quiet --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unroll vendor sources
          command: tar -xf baked-build.tar
      - run:
          name: Pre-run checks
          command: du -sh .
      - run:
          name: Cooldown
          command: sleep 60
      - run:
          command: ./bake-manager
